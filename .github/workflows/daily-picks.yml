name: Generate Daily Picks

on:
  schedule:
    # Mon-Sat: 1 PM ET (EDT=UTC-4) = 17:00 UTC. Deliberately :07 and not :00 —
    # GitHub deprioritises schedules on the hour, when everyone else's crons
    # fire. Measured delay was a tolerable 12-44 min through 2026-08-25, then
    # blew out to 2h, 8.3h and 7.9h on Aug 26-28 while still using :00.
    - cron: '7 17 * * 1-6'
    # Sunday: 9 AM ET = 13:00 UTC. The NFL's main slate kicks off at 1:00 PM ET
    # and most Sunday MLB games start at 1:05 PM, so the Mon-Sat slot would drop
    # picks after first pitch/kickoff. Sunday trades a little line freshness for
    # actually being actionable.
    # Caveat: NFL London games kick at 9:30 AM ET a few weeks a season and will
    # land right at the wire.
    - cron: '7 13 * * 0'
  workflow_dispatch: # Allow manual runs from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit daily-picks.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate picks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node generate-picks.mjs

      - name: Commit and push daily-picks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add daily-picks.json
          if [ -f picks-archive.json ]; then git add picks-archive.json; fi
          git diff --staged --quiet || (git commit -m "chore: daily picks $(date -u +%Y-%m-%d) [skip ci]" && git push)
