name: Generate Daily Picks

on:
  schedule:
    # 09:07 UTC every day = 5:07 AM ET (EDT). Deliberately :07 and not :00 —
    # GitHub deprioritises schedules on the hour when everyone else's crons fire.
    #
    # This fires MUCH earlier than the target publish time on purpose. GitHub's
    # scheduler does not run these when asked: measured delay from the cron time
    # to the actual commit, Aug 29 - Sep 4 2026, was
    #     2h24m, 2h38m, 2h40m, 2h48m, 4h18m, 4h47m
    # so the realistic landing window is 07:30-10:00 ET. That clears college
    # football's noon ET kickoffs and the NFL's 1 PM ET main slate with hours to
    # spare, and gets MLB day games too.
    #
    # NEVER quote the cron time in UI copy — it is not when picks appear.
    #
    # Known edge: NFL London games kick at 9:30 AM ET a few Sundays a season and
    # can still land inside a worst-case delay.
    - cron: '7 9 * * *'
  workflow_dispatch: # Allow manual runs from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit daily-picks.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate picks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node generate-picks.mjs

      - name: Commit and push daily-picks.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add daily-picks.json
          if [ -f picks-archive.json ]; then git add picks-archive.json; fi
          git diff --staged --quiet || (git commit -m "chore: daily picks $(date -u +%Y-%m-%d) [skip ci]" && git push)
